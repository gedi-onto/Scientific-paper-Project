[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphrag-stage1"
version = "0.2.0"
description = "Ontology-driven knowledge-extraction pipeline: paragraphs to a typed, provenance-anchored Knowledge Artifact Graph."
readme = "DESIGN.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Gedi" }]
keywords = ["graphrag", "knowledge-graph", "ontology", "nlp", "rag", "provenance"]

# Core install (Stage 1 + Stage 2) needs only an HTTP client for the LLM.
dependencies = [
    "requests>=2.31,<3",
]

[project.optional-dependencies]
# Stage 3 ontology mapping / SHACL publication gating.
ontology = [
    "rdflib>=7.0,<8",
    "pyshacl>=0.28,<1",
]
# IR schema validation (graphrag_stage1.validate).
validation = [
    "jsonschema>=4.18",
]
# OntoGPT/OAK-style entity grounding (graphrag_stage1.grounding). Resolves entity
# mentions to real OBO term IDs (ChEBI, PRO, GO, MONDO, UBERON...) via oaklib,
# without loading those ontologies into memory.
grounding = [
    "oaklib>=0.5",
]
# Ready-made provider clients (graphrag_stage1.clients).
anthropic = [
    "anthropic>=0.40",
]
openai = [
    "openai>=1.40",
]
dev = [
    "pytest>=8",
    "jsonschema>=4.18",
]

[tool.setuptools]
# Explicit package list: ship only the library, not the root-level dev/CLI
# scripts (eval*.py, pipeline_runner.py, readiness_check.py, build_osti_corpus.py)
# or the tests.
packages = ["graphrag_stage1"]

[tool.setuptools.package-data]
# Ship the versioned IR JSON Schemas, and the FOUNDATIONAL ontologies, inside the wheel.
#
# The ontology stack (IAO, CCO, RO, and the Stage 2/3 alignment + SHACL shapes) is ~3.7 MB,
# identical for every user, and required for Stage 3 to do anything. Shipping it means
# `pip install graphrag-stage1[ontology]` yields a working Stage 3 with nothing to fetch.
#
# The DOMAIN ontology is intentionally absent: it changes per scientific domain, it is the
# user's choice, and it can dwarf the core (UBERON alone is 48 MB). Users pass their own
# via `domain_ontology=`; the repo keeps examples under the top-level ontologies/Domain/.
graphrag_stage1 = [
    "schemas/*.json",
    "ontologies/*.owl",
    "ontologies/*.ttl",
    "ontologies/*.md",
    "ontologies/Relations/*",
    "ontologies/Alignment/*",
]

[tool.pytest.ini_options]
# Tests live at the repo root and import the installed/importable package.
testpaths = [
    "test_pipeline.py", "test_stage3.py", "test_schemas.py",
    "test_throughput.py", "test_clients.py", "test_stage2_batching.py", "test_llm_client.py", "test_ontology_lookup.py", "test_entity_fallback.py", "test_grounding.py",
]
