[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphrag-stage1"
version = "0.1.0"
description = "Ontology-driven knowledge-extraction pipeline: paragraphs to a typed, provenance-anchored Knowledge Artifact Graph."
readme = "DESIGN.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Gedi" }]
keywords = ["graphrag", "knowledge-graph", "ontology", "nlp", "rag", "provenance"]

# Core install (Stage 1 + Stage 2) needs only an HTTP client for the LLM.
dependencies = [
    "requests>=2.31,<3",
]

[project.optional-dependencies]
# Stage 3 ontology mapping / SHACL publication gating.
ontology = [
    "rdflib>=7.0,<8",
    "pyshacl>=0.28,<1",
]
# IR schema validation (graphrag_stage1.validate).
validation = [
    "jsonschema>=4.18",
]
# Ready-made provider clients (graphrag_stage1.clients).
anthropic = [
    "anthropic>=0.40",
]
openai = [
    "openai>=1.40",
]
dev = [
    "pytest>=8",
    "jsonschema>=4.18",
]

[tool.setuptools]
# Explicit package list: ship only the library, not the root-level dev/CLI
# scripts (eval*.py, pipeline_runner.py, readiness_check.py, build_osti_corpus.py)
# or the tests.
packages = ["graphrag_stage1"]

[tool.setuptools.package-data]
# Ship the versioned IR JSON Schemas inside the wheel.
graphrag_stage1 = ["schemas/*.json"]

[tool.pytest.ini_options]
# Tests live at the repo root and import the installed/importable package.
testpaths = [
    "test_pipeline.py", "test_stage3.py", "test_schemas.py",
    "test_throughput.py", "test_clients.py", "test_stage2_hybrid.py", "test_llm_client.py",
]
